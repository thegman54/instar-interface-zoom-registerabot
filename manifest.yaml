name: zoom_registerabot
display_name: Zoom (via RegisterABot)
description: Thin multi-tenant Zoom adapter — receives Zoom Team Chat messages + files over Zoom's outbound event WebSocket and pipes them to a bot over the RegisterABot relay as a service client (using its OWN service key). The target bot slug comes from the profile that checks this interface. Outbound files/audio/video are delivered as the relay's short-lived hosted links (Zoom's chatbot API can't push binary). No gatekeeper contact for messages.
type: interface
category: Interfaces
icon: zoom
version: "0.2.0"
tenancy: multi_tenant
connection:
  pattern: http
  port: 8092
  container_name: zoom-registerabot

# The adapter's OWN identity + platform creds (self-fetched from Infisical). NOT the bot slug —
# that is supplied per-profile via binding_fields below and delivered on /slugs/{bot}/connect.
credentials:
  - ZOOM_CLIENT_ID
  - ZOOM_CLIENT_SECRET
  - ZOOM_BOT_JID
  - ZOOM_WS_SUBSCRIPTION_ID
  - ZOOM_VERIFICATION_TOKEN
  - REGISTERABOT_RELAY_URL
  - ZOOM_REGISTERABOT_SERVICE_SLUG
  - ZOOM_REGISTERABOT_TOKEN

# Per-profile binding: which bot this profile routes to (its registerabot slug). This is how
# the profile hands the adapter its bot slug — the adapter never owns it.
binding_fields:
  - name: bot_slug
    label: Bot Slug (registerabot)
    type: text
    required: true
