# Zoom → RegisterABot thin adapter (multi-tenant interface).
# - Self-fetches its OWN creds from Infisical at startup (service slug + service key + Zoom).
# - Exposes a control plane on :8092 so the gatekeeper can POST /slugs/{bot}/connect on profile
#   launch — that's how the bot slug (from the profile) reaches the adapter.
# - Joins instar-internal (reachable by the gatekeeper) + instar-network (outbound to Zoom/relay).
services:
  api:
    build: .
    container_name: zoom-registerabot
    environment:
      - INFISICAL_URL=http://infisical:8080
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-prod}
      - REGISTERABOT_RELAY_URL=${REGISTERABOT_RELAY_URL:-wss://relay.registerabot.com}
      - CONTROL_PORT=8092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - instar-internal
      - instar-network

networks:
  instar-internal:
    external: true
  instar-network:
    external: true
