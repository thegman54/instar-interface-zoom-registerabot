# Zoom → RegisterABot thin adapter (multi-tenant interface).
# - Self-fetches its OWN creds from Infisical at startup (service slug + service key + Zoom).
# - Control plane :8092 — the gatekeeper POSTs /slugs/{bot}/connect on profile launch (internal).
# - Webhook :8087 — Zoom's Bot Endpoint. Zoom chatbots deliver user messages to a webhook (not a
#   WebSocket), so point a Cloudflare Tunnel at zoom-registerabot:8087 and set the Zoom app's Bot
#   Endpoint URL to <tunnel-host>/webhook (same pattern as the old zoom connector's zoom-api:8087).
# - Joins instar-internal (gatekeeper reach) + instar-network (outbound to Zoom/relay; the tunnel
#   sidecar reaches :8087 over the shared network).
services:
  api:
    build: .
    container_name: zoom-registerabot
    environment:
      - INFISICAL_URL=http://infisical:8080
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-prod}
      - REGISTERABOT_RELAY_URL=${REGISTERABOT_RELAY_URL:-wss://relay.registerabot.com}
      - CONTROL_PORT=8092
      - WEBHOOK_PORT=8087
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - instar-internal
      - instar-network

networks:
  instar-internal:
    external: true
  instar-network:
    external: true
